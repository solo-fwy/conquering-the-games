name: Extract project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "conquering-the-games.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check files
        run: |
          echo "Files in repository:"
          ls -la
          echo ""
          echo "ZIP files:"
          ls -lh *.zip || true

      - name: Extract ZIP
        run: |
          set -euxo pipefail

          if [ ! -f "conquering-the-games.zip" ]; then
            echo "ERROR: conquering-the-games.zip was not found!"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -o "conquering-the-games.zip" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 3 -type f -print

          if [ -d "extracted/conquering-the-games" ]; then
            cp -a extracted/conquering-the-games/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f conquering-the-games.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update WCG project"
          git push
