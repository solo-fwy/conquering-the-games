name: Extract project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "conquering-the-games.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP..."
          test -f conquering-the-games.zip

          rm -rf extracted
          mkdir -p extracted

          unzip -o conquering-the-games.zip -d extracted

          if [ -d "extracted/conquering-the-games" ]; then
            cp -a extracted/conquering-the-games/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f conquering-the-games.zip

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update WCG project"
          git push
