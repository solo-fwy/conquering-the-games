name: Extract project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o conquering-the-games.zip -d extracted

          if [ -d "extracted/conquering-the-games" ]; then
            cp -r extracted/conquering-the-games/. .
          else
            cp -r extracted/. .
          fi

          rm -rf extracted
          rm -f conquering-the-games.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract project files" || exit 0
          git push
