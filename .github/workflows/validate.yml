name: Validate WCG project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check project files
        run: |
          set -e

          test -f package.json
          test -f server.js
          test -f public/index.html
          test -f public/verify.html
          test -f public/style.css
          test -f public/app.js

          echo "WCG project files are present."
